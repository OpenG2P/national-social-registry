apiVersion: v2
name: openg2p-nsr
description: |
  OpenG2P National Social Registry (NSR) — a self-sufficient Helm chart for the
  NSR registry stack (staff portal API/UI, partner API, celery beat/worker,
  db-seed, id-generator). Supplies NSR-branded Docker images and NSR-specific
  ID-generator configuration. Previously a thin wrapper over the
  openg2p-registry base chart; that chart's templates and defaults now live
  directly in this chart, so it no longer depends on openg2p-registry.
type: application

# Version handling:
#   This `version` is a STATIC placeholder — it is NOT the published version.
#   The helm-publish workflow derives the real version from the BRANCH NAME and
#   overrides this at package time via `helm package --version`:
#       develop  -> 0.0.0-develop.<run>
#       N.N      -> N.N.0-develop.<run>   (Helm needs 3-part SemVer)
#       N.N.N    -> N.N.N                  (frozen release, no suffix)
#   (see ".github/workflows/helm-publish.yml" and the "Helm chart versioning"
#   section in the NSR Gitbook docs). The value below is used ONLY for a local
#   `helm package`/`helm install .` that does not pass --version, so just keep
#   it a valid SemVer; bumping it has no effect on CI-published charts.
version: 1.0.0
appVersion: "develop"

keywords:
  - openg2p
  - social-registry
  - nsr
  - registry

home: https://openg2p.org
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
  - https://github.com/OpenG2P/national-social-registry
maintainers:
  - name: OpenG2P
    email: info@openg2p.org

# Sub-dependencies — identical to the openg2p-registry base chart this was
# derived from. Fetched from the OpenG2P Helm repo via `helm dependency build`
# (the packaged .tgz are gitignored, same as the base chart).
dependencies:
  - name: common
    repository: https://openg2p.github.io/openg2p-helm
    version: 2.30.0
  - name: postgres-init
    version: 1.2.0 
    repository: https://openg2p.github.io/openg2p-helm
    condition: postgres-init.enabled
  - name: redis
    version: 19.6.4
    repository: https://openg2p.github.io/openg2p-helm
    condition: redis.enabled
  - name: openg2p-id-generator
    alias: idgenerator
    version: 1.0.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: idgenerator.enabled
  - name: keycloak-init
    version: 1.1.1
    repository: https://openg2p.github.io/openg2p-helm
    condition: keycloak-init.enabled
  - name: openg2p-awe
    version: 1.0.0
    repository: https://openg2p.github.io/openg2p-helm
    condition: openg2p-awe.enabled
  # WebSub event hub + consolidator — pulled UNMODIFIED from the MOSIP Helm
  # repo (not openg2p-helm). Disabled by default: both require an external
  # Kafka and a websub config-server, which are NOT provisioned by this chart.
  # Enable only once those are available and configured via the values blocks.
  - name: websub
    version: 1.3.0-beta.1-develop
    repository: https://mosip.github.io/mosip-helm
    condition: websub.enabled
  - name: websub-consolidator
    version: 1.3.0-beta.1-develop
    repository: https://mosip.github.io/mosip-helm
    condition: websub-consolidator.enabled

# Rancher catalog branding
annotations:
  catalog.cattle.io/display-name: "OpenG2P NSR"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: ">=1.23.0-0"
  openg2p.org/add-to-rancher: ""
