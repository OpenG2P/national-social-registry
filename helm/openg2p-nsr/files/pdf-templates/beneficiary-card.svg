<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <!-- OpenG2P NSR beneficiary card. Placeholders {{...}} are filled by the
       Agent Portal API at render time: claim fields, {{photo}} and {{qr}} are
       base64 data-URIs, {{title}} / {{issuerName}} are config. Designers edit
       this file (helm/openg2p-nsr/files/pdf-templates/) — it is shipped as a
       ConfigMap and mounted into the API at /app/pdf-templates. -->
  <rect width="600" height="380" fill="#ffffff" stroke="#0b6e4f" stroke-width="4"/>
  <rect x="0" y="0" width="600" height="56" fill="#0b6e4f"/>
  <text x="24" y="36" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff">{{title}}</text>
  <text x="24" y="78" font-family="Helvetica" font-size="12" fill="#555555">Issued by {{issuerName}}</text>

  <image x="430" y="92" width="146" height="168" href="{{photo}}" preserveAspectRatio="xMidYMid slice"/>

  <text x="24" y="120" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0b6e4f">FULL NAME</text>
  <text x="24" y="140" font-family="Helvetica" font-size="14">{{fullName}}</text>
  <text x="24" y="172" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0b6e4f">FUNCTIONAL ID</text>
  <text x="24" y="192" font-family="Helvetica" font-size="14">{{functionalRecordId}}</text>
  <text x="24" y="224" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0b6e4f">DATE OF BIRTH</text>
  <text x="24" y="244" font-family="Helvetica" font-size="14">{{dateOfBirth}}</text>

  <image x="24" y="256" width="116" height="116" href="{{qr}}"/>
  <text x="150" y="372" font-family="Helvetica" font-size="9" fill="#777777">Scan the QR to verify this credential offline.</text>
</svg>
