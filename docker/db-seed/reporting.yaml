# National Social Registry — what the reporting generator cannot work out itself.
#
# The mechanical part of the reporting layer is generated by the platform's
# generate_reporting_views.py: one view per entity node, geography inherited from
# the parent, workflow columns carried, personal data withheld. This file holds
# only the decisions that are ours to make.

prefix: nsr_rpt_

# The entity tree — DECLARED, not discovered.
#
# Discovery reads the data, and a production registry is installed EMPTY: the
# country loads its register afterwards. On that install nothing resolves and
# every view loses its geography while still existing, which reads as working.
#
# Produced by `generate_reporting_views.py --discover` against a populated
# environment, then reviewed. `score` hangs off household, which no amount of
# schema-reading would establish — g2p_register_scores carries a register_id and
# Master Data's definitions name Household.
tree:
  household:                     null
  individual:                    {parent: household}
  individual_vulnerability:      {parent: individual}
  individual_livelihood:         {parent: individual}
  individual_disability:         {parent: individual}
  individual_land:               {parent: individual}
  individual_livestock:          {parent: individual}
  individual_program:            {parent: individual}
  individual_shock:              {parent: individual}
  household_housing_and_service: {parent: household}
  household_program:             {parent: household}
  household_asset:               {parent: household}
  score:                         {parent: household}
  score_history:                 null

# Hand-written, and left alone by the generator.
#
# These two are SEMANTIC: they pair household and individual, derive the bands
# and flags the dashboards group by, and are materialized because the JSONB
# unpacking over a bulk-loaded register is far too slow to run per chart.
#
custom:
  - household
  - individual

pii:
  allow:
    # A PROGRAMME's name, not a person's. The classifier withholds anything
    # ending in `_name` — right for a person, wrong for a social protection
    # programme, and "how many households are enrolled in which programme" is
    # most of what this registry is asked.
    - program_name
    # The KIND of handset (basic / smart / none), not a number. It matches the
    # `phone` pattern and carries no contact detail at all — it is a proxy for
    # digital access, which is a genuine vulnerability indicator.
    - mobile_phone_type
