name: Build & Publish

# Under the inverted build model, this repo builds only THIN images that extend
# the registry-platform base images (docker/*/Dockerfile = FROM
# openg2p/openg2p-registry-* + pip install nsr-extension), and a thin Helm chart
# (helm/openg2p-nsr) that overlays the openg2p-registry chart. All are built
# together at ONE version per commit; the openg2p-registry base image + chart
# dependency they extend are HARDCODED (RP_VERSION in each Dockerfile / the
# dependency in Chart.yaml), not derived here.
#
# There is no NSR sanity image: NSR's registers, tables and DCI template shape
# match the platform's reference registry, so the published
# openg2p-registry-sanity-tests image applies unchanged (see the chart values).
#
# All versioning / build / promote / publish / changelog policy lives in
# openg2p-packaging behind @v1.

on:
  push:
    # All real branches + tags, but NOT bot branches.
    branches: ["**", "!dependabot/**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only. Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a frozen release e.g. 1.0.1. Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # Thin images. There is no REGISTRY_PLATFORM_REF / FASTAPI_COMMON_REF /
      # IAM_CORE_REF pin any more — the platform and its deps are baked into the
      # base image, selected by RP_VERSION (the base image tag, hardcoded in each
      # Dockerfile and kept in lockstep with the openg2p-registry chart
      # dependency in helm/openg2p-nsr/Chart.yaml).
      images: |
        [
          {"name": "staff-api",
           "repo": "openg2p/openg2p-nsr-staff-api",
           "dockerfile": "docker/staff-api/Dockerfile"},

          {"name": "partner-api",
           "repo": "openg2p/openg2p-nsr-partner-api",
           "dockerfile": "docker/partner-api/Dockerfile"},

          {"name": "celery",
           "repo": "openg2p/openg2p-nsr-celery",
           "dockerfile": "docker/celery/Dockerfile"},

          {"name": "db-seed",
           "repo": "openg2p/openg2p-nsr-db-seed",
           "dockerfile": "docker/db-seed/Dockerfile"}
        ]

      # The thin wrapper chart. It owns no templates — it pins openg2p-registry
      # as a dependency (aliased `registry`) and supplies the NSR overlay.
      chart-path: helm/openg2p-nsr

      # This chart owns no templates, so Rancher would show an empty form (it
      # reads questions.yaml only from the installed chart's ROOT, never from a
      # subchart). CI regenerates questions.yaml at package time from the pinned
      # openg2p-registry dependency, prefixing non-`global.` variables with the
      # `registry` alias — so the NSR form matches the platform's exactly and
      # cannot drift. Nothing about questions is kept in this repo.
      chart-inherit-questions: '{"dependency":"openg2p-registry","alias":"registry"}'

      # Rewrite ONLY the NSR-built image tags (nested under the `registry`
      # subchart alias) to this commit's version — images and chart locked
      # together. beneApi/staffUi/sanity are consumed as-is from the platform
      # images, so they carry no NSR tag to rewrite. The openg2p-registry
      # dependency version is intentionally NOT here (it stays hardcoded).
      chart-image-paths: |
        [".registry.staffApi.image.tag",
         ".registry.partnerApi.image.tag",
         ".registry.celeryWorker.image.tag",
         ".registry.celeryBeat.image.tag",
         ".registry.dbSeed.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
